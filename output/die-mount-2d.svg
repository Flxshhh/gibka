  <g font-family="Arial, sans-serif" fill="#172638">
    <text x="32" y="42" font-size="26" font-weight="bold">Крепление матрицы</text>
    <text x="430" y="95" font-size="16">Рабочий V-ручей</text>
    <text x="430" y="211" font-size="16">Боковой бортик держателя</text>
    <text x="430" y="260" font-size="16">Нижняя выемка матрицы</text>
    <text x="430" y="295" font-size="16">Опорная полка держателя</text>
    <text x="430" y="322" font-size="16">Стол пресса</text>
    <text x="32" y="482" font-size="15">Матрица опирается нижними площадками на полку.</text>
    <text x="32" y="504" font-size="15">Бортики ограничивают смещение поперёк оси гиба.</text>
