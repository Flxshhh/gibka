<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1050" role="img" aria-labelledby="title desc">
  <title id="title">Крепление пуансона — вид сбоку</title>
  <desc id="desc">Эскиз по фотографии. Промежуточный держатель подвешен к балке верхним прижимом. Отдельная подпружиненная губка удерживает хвостовик пуансона. Размер A от посадочной плоскости пуансона до стола.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#34465a"/>
    </marker>
  </defs>
  <rect width="800" height="1050" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" fill="#172638">
    <text x="42" y="49" font-size="26" font-weight="bold">Крепление пуансона</text>
    <text x="42" y="75" font-size="15">Поперечное сечение по референсу · эскиз без масштаба</text>
  </g>
  <!-- Координаты контуров сняты с референса и равномерно масштабированы. -->
  <g transform="translate(49 105) scale(.33)" stroke="#34465a" stroke-width="4" stroke-linejoin="round">
    <!-- Верхняя балка -->
    <path fill="#bac5d2" d="M379 25 Q410 26 439 19 T497 37 T563 26 Q614 -1 638 6 Q661 11 694 37 V404 H636 V613 H379Z"/>
    <!-- Промежуточный держатель и его верхний хвостовик -->
    <path fill="#859bb4" d="M515 613 H636 V477 H694 V553 H679 V592 H694 V837 H636 V1063 H573 V837 H515Z"/>
    <path fill="#657e9a" d="M515 613 H636 V694 H515Z"/>
    <!-- Верхний прижим -->
    <path fill="#b3bdd1" d="M694 327 H721 L758 390 V489 L722 553 H694 V516 L698 511 V369 L694 365Z"/>
    <!-- Пуансон, хвостовик и боковой паз -->
    <path fill="#e3b77b" d="M577 1063 H636 V930 H688 Q695 930 695 941 V1003 H680 V1042 H695 V1171 Q695 1182 690 1196 L629 1381 L630 1389 L608 1465 Q604 1474 601 1465 L577 1392 Q613 1267 579 1165 Q576 1154 576 1145Z"/>
    <!-- Винт и пружина нижнего прижима -->
    <path fill="#6c8097" d="M499 861 H698 V904 H499Z"/>
    <path fill="#96a7ba" d="M515 838 H559 V926 H515Z"/>
    <path d="M637 908 l7 -56 13 62 7 -62 13 62 7 -62 13 59" fill="none" stroke="#45576d" stroke-width="9" stroke-linecap="round"/>
    <!-- Нижняя губка входит зацепом в паз хвостовика -->
    <path fill="#a3b5cf" d="M695 770 H750 Q762 770 762 783 V938 L714 1042 H680 V1013 H702 V998 H695 V890 L698 883 V811 L695 804Z"/>
    <!-- Матрица, нижний держатель и стол -->
    <path fill="#e3b77b" d="M469 1830 H550 Q558 1830 565 1838 L604 1879 L650 1835 Q655 1830 662 1830 H740 V1885 L659 1960 Q653 1966 660 1974 L740 2046 V2101 H642 L604 2064 L566 2101 H468 V2080 L578 1976 Q591 1964 576 1950 L474 1857 Q469 1852 469 1845Z"/>
    <path fill="#859bb4" d="M423 2191 V2062 Q423 2055 430 2055 H460 Q467 2055 467 2062 V2095 L464 2101 L470 2106 L474 2101 H734 L739 2106 L746 2100 L740 2094 V2063 Q740 2055 747 2055 H776 Q784 2055 784 2063 V2191Z"/>
    <path fill="#bac5d2" d="M333 2191 H875 V2327 H740 V2528 Q696 2508 653 2524 Q570 2544 469 2499 V2327 H333Z"/>
    <path d="M604 515 V2528" fill="none" stroke-dasharray="37 13 8 13" opacity=".55"/>
  </g>
  <g fill="none" stroke="#34465a" stroke-width="1.2">
    <path d="M110 456H239 M110 828H159"/>
    <path d="M120 456V828" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M224 152H340 M290 246H340 M269 333H340 M298 369H340 M275 445H340 M249 456L322 487H340 M258 548H340 M283 743H340 M292 812H340 M319 850H340"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="16" fill="#172638">
    <text x="99" y="648" font-weight="bold">A</text>
    <text x="351" y="157">Верхняя балка</text>
    <text x="351" y="251">Верхний прижим держателя</text>
    <text x="351" y="338">Промежуточный держатель</text>
    <text x="351" y="374">Винт и пружина нижнего прижима</text>
    <text x="351" y="450">Зацеп губки в пазу хвостовика</text>
    <text x="351" y="492">Посадочное плечо пуансона</text>
    <text x="351" y="553">Пуансон</text>
    <text x="351" y="748">Матрица</text>
    <text x="351" y="817">Держатель матрицы</text>
    <text x="351" y="855">Стол пресса</text>
    <text x="42" y="994" font-size="15">A — от посадочной плоскости пуансона до верхней поверхности стола.</text>
    <text x="42" y="1017" font-size="15">Контуры и положение деталей восстановлены по изображению.</text>
  </g>
</svg>
