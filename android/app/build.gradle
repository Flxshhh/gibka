plugins {
    id 'com.android.application'
}

android {
    namespace 'com.flxshhh.gibka'
    compileSdk 34

    defaultConfig {
        applicationId 'com.flxshhh.gibka'
        minSdk 21
        targetSdk 34
        // номер сборки растёт с каждой сборкой на GitHub — новое приложение ставится поверх старого
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName "1.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
    }

    // Ключ подписи приходит из секретов GitHub (см. .github/workflows/android.yml), в репозитории его нет
    signingConfigs {
        release {
            storeFile file(System.getenv('KEYSTORE_FILE') ?: 'release.keystore')
            storePassword System.getenv('KEYSTORE_PASSWORD')
            keyAlias System.getenv('KEY_ALIAS') ?: 'listogib'
            keyPassword System.getenv('KEYSTORE_PASSWORD')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
